function loadQuiz() {
    const quizBox = document.getElementById('quiz-box');
    quizData.forEach((item, qIndex) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        
        // स्वचलित क्रमबद्ध संख्या (1, 2, 3... N)
        const cleanQText = item.q.replace(/^\d+\.\s*/, '');
        qTitle.innerText = `${qIndex + 1}. ${cleanQText}`;
        qCard.appendChild(qTitle);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        item.options.forEach((opt, oIndex) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, qIndex, oIndex, optionsGrid);
            optionsGrid.appendChild(btn);
        });

        qCard.appendChild(optionsGrid);
        quizBox.appendChild(qCard);
    });
}

function selectOption(selectedBtn, qIndex, selectedOptIndex, optionsGrid) {
    const correctOptIndex = quizData[qIndex].ans;
    const buttons = optionsGrid.querySelectorAll('.option-btn');

    // विकल्प चुनने के बाद प्रश्न के सभी बटन को अक्षम करें
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOptIndex === correctOptIndex) {
        selectedBtn.classList.add('correct');
    } else {
        selectedBtn.classList.add('incorrect');
        buttons[correctOptIndex].classList.add('correct'); // सही उत्तर को हरा रंग दिखाएं
    }
}

window.onload = loadQuiz;
