// सही उत्तर समेत सभी विकल्पों को पूरी तरह से शफ़ल (Shuffle) करने का फ़ंक्शन
function prepareQuizData() {
    quizData.forEach(item => {
        // सबसे पहले मूल सही उत्तर को सुरक्षित करें
        const correctAnswer = item.options[item.ans];

        // Fisher-Yates shuffle तकनीक द्वारा सभी 4 विकल्पों को पूरी तरह से रैंडम करें
        for (let i = item.options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [item.options[i], item.options[j]] = [item.options[j], item.options[i]];
        }

        // शफ़ल होने के बाद सही उत्तर जिस नए इंडेक्स (0, 1, 2, या 3) पर पहुंचा है, उसे अपडेट करें
        item.ans = item.options.indexOf(correctAnswer);
    });
}

function loadQuiz() {
    prepareQuizData();
    const quizBox = document.getElementById('quiz-box');
    quizData.forEach((item, qIndex) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        
        // स्वचलित क्रमबद्ध संख्या (1, 2, 3... N)
        const cleanQText = item.q.replace(/^\d+\.\s*/, '');
        qTitle.innerText = `${qIndex + 1}. ${cleanQText}`;
        qCard.appendChild(qTitle);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        item.options.forEach((opt, oIndex) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, qIndex, oIndex, optionsGrid, explanationBox);
            optionsGrid.appendChild(btn);
        });

        qCard.appendChild(optionsGrid);

        // Explanation box: answer select करने के बाद दिखेगा
        const explanationBox = document.createElement('div');
        explanationBox.className = 'explanation';
        explanationBox.innerHTML = `<strong>व्याख्या:</strong> ${item.explanation}`;
        qCard.appendChild(explanationBox);

        quizBox.appendChild(qCard);
    });
}

function selectOption(selectedBtn, qIndex, selectedOptIndex, optionsGrid, explanationBox) {
    const correctOptIndex = quizData[qIndex].ans;
    const buttons = optionsGrid.querySelectorAll('.option-btn');

    // विकल्प चुनने के बाद प्रश्न के सभी बटन को अक्षम करें
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOptIndex === correctOptIndex) {
        selectedBtn.classList.add('correct');
    } else {
        selectedBtn.classList.add('incorrect');
        buttons[correctOptIndex].classList.add('correct'); // सही उत्तर को हरा रंग दिखाएं
    }

    // उत्तर चुनने के तुरंत बाद explanation दिखाएं
    explanationBox.classList.add('show');
}

window.onload = loadQuiz;
</script>
